# Firebase App Hosting configuration.
# https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0
  maxInstances: 10
  cpu: 1
  memoryMiB: 512

# Public env vars (needed at BUILD time because NEXT_PUBLIC_* is inlined).
# Server-only secrets (SANITY_TOKEN, ONESIGNAL_API_KEY, RESEND_API_KEY,
# NOTIFY_SECRET) and the NEXT_PUBLIC_FIREBASE_* values are set in the
# Firebase console: App Hosting > backend > Settings > Environment variables.
env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://freefall-news.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_PROJECT_ID
    value: v0wwcks1
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SANITY_DATASET
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ONESIGNAL_APP_ID
    value: 5126ebf9-eff0-4867-9562-33a41623ee75
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SMARTNEXUS_PROVIDER_ID
    value: oidc.smartnexus
    availability:
      - BUILD
      - RUNTIME
